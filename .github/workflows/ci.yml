name: CI

# Every push and pull request: the brief's gates that a machine can run (07_QA). A red check means the
# site is not in a shippable state; the launch checklist covers what only people can verify.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so `next build` can run its env validation and prerender without secrets.
  # Real values live in Vercel; nothing here is a credential.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SANITY_PROJECT_ID: ci-placeholder
  NEXT_PUBLIC_SANITY_DATASET: production
  SANITY_API_READ_TOKEN: ci
  SANITY_REVALIDATE_SECRET: ci
  MUX_TOKEN_ID: ci
  MUX_TOKEN_SECRET: ci
  RESEND_API_KEY: ci
  EMAIL_FROM: "ATHLIMA <ci@example.invalid>"
  POSTGRES_URL: postgres://ci:ci@127.0.0.1:1/ci
  NEXT_PUBLIC_GA_ID: G-CI
  SENTRY_DSN: https://ci@o0.ingest.sentry.io/0
  NEXT_PUBLIC_SENTRY_DSN: https://ci@o0.ingest.sentry.io/0

jobs:
  web:
    name: web — lint, types, routes, schemas, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run routes:check
      - run: npm run schemas:check
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Playwright starts the production server itself (playwright.config.ts) — the same bytes a visitor gets.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  studio:
    name: studio — types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
